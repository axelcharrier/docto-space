# Deployed as-is to /srv/docker/doctospace/compose.yaml by the deploy
# workflow on every push to main — edit it here, not on the VPS.
# Secrets go in a sibling .env (perms 600, managed by hand on the VPS) — see
# .env.example next to this file for the full list of variables.
services:
  migrate:
    image: ghcr.io/axelcharrier/doctospace-migrate:latest
    env_file: .env
    restart: "no"
    # MariaDB runs on the host, not in Docker: expose it as host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    image: ghcr.io/axelcharrier/doctospace:latest
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
